# Level 4: the smallest explicit Serial Bridge route.
# Data received by input is forwarded to output.

gateway {
  endpoints = [
    {
      id = "input"
      name = "Input Device"
      port = "COM1"
      baudRate = 9600
    },
    {
      id = "output"
      name = "Output Device"
      port = "COM2"
      baudRate = 9600
    }
  ]

  routes = [
    {
      name = "Input to Output"
      sources = ["input"]
      targets = ["output"]
      enabled = true
    }
  ]
}
