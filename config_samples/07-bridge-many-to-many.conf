# 多对多全互联桥接测试配置（5 端点 × 20 条路由）
#
# 前置条件：5 组虚拟串口对，每组一端接桥接、另一端接串口终端发数据。
#   组 1：COM1（桥接）/ COM2（测试端）
#   组 2：COM3（桥接）/ COM4（测试端）
#   组 3：COM5（桥接）/ COM6（测试端）
#   组 4：COM7（桥接）/ COM8（测试端）
#   组 5：COM9（桥接）/ COM10（测试端）
#
# 行为：任意桥接端口收到的数据，转发给其余 4 个端口。
# 在任一测试端发送一条数据，另外 4 个测试端都应收到。

gateway {
  # 日志显示格式：auto（可打印则文本，否则 HEX）/ text / hex（大写带空格）
  logFormat = "auto"
  # true：一次转发只记一条（源 → 全部目标）；false：每个目标各记一行，用于逐路排查。
  mergeForwardedLogs = true
  # true：把源端输入信号镜像到路由目标的输出（CTS→RTS、DSR→DTR），模拟真线缆握手线。
  forwardSignals = false
  # drop：接收队列满时丢旧字节并告警（默认）；block：阻塞驱动回调线程而非丢包，转发固件等裸流时用。
  backpressure = "drop"

  endpoints = [
    { id = "n1", name = "Node 1 (COM1)", port = "COM1",  baudRate = 115200, dataBits = 8, stopBits = 1, parity = "none", flowControl = "none" },
    { id = "n2", name = "Node 2 (COM3)", port = "COM3",  baudRate = 115200, dataBits = 8, stopBits = 1, parity = "none", flowControl = "none" },
    { id = "n3", name = "Node 3 (COM5)", port = "COM5",  baudRate = 115200, dataBits = 8, stopBits = 1, parity = "none", flowControl = "none" },
    { id = "n4", name = "Node 4 (COM7)", port = "COM7",  baudRate = 115200, dataBits = 8, stopBits = 1, parity = "none", flowControl = "none" },
    { id = "n5", name = "Node 5 (COM9)", port = "COM9",  baudRate = 115200, dataBits = 8, stopBits = 1, parity = "none", flowControl = "none" }
  ]

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "N1", "N2", "N3", "N4", "N5"]
  }

  routes = [
    { name = "N1 fan-out", sources = ["n1"], targets = ["n2", "n3", "n4", "n5"], enabled = true },
    { name = "N2 fan-out", sources = ["n2"], targets = ["n1", "n3", "n4", "n5"], enabled = true },
    { name = "N3 fan-out", sources = ["n3"], targets = ["n1", "n2", "n4", "n5"], enabled = true },
    { name = "N4 fan-out", sources = ["n4"], targets = ["n1", "n2", "n3", "n5"], enabled = true },
    { name = "N5 fan-out", sources = ["n5"], targets = ["n1", "n2", "n3", "n4"], enabled = true }
  ]
}
