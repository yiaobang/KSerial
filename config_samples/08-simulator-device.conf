# Level 8: AT-style Device Simulator, designed to run at the same time as
# 07-bridge-many-to-many.conf.
# The simulator occupies COM4 (the test end of the COM3/COM4 virtual pair),
# so its peer COM3 is a bridge endpoint. Data forwarded by the bridge to COM3
# shows up on COM4, the simulator answers, and the reply flows back through
# the bridge to every other port.
# Baud rate and line parameters MUST match the bridge endpoints (115200 8N1).

simulator {
  endpoint {
    port = "COM11"
    baudRate = 115200
    dataBits = 8
    stopBits = 1
    parity = "none"
    flowControl = "none"
  }

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["OK", "ERROR", "KSerial", "AT+VERSION"]
  }

  encode = "ASCII"
  delimiter = "\r\n"

  # 全局应答延迟：固定毫秒数，或 "min~max" 区间内随机（模拟真设备处理耗时的抖动）。
  # 单条规则可用 delay 覆盖。用它测上位机的超时重传：调大后看上位机是否会重发、重复处理应答。
  responseDelay = "10~80"

  rules = [
    {
      request = "AT\r\n"
      response = "OK\r\n"
    },
    {
      request = "AT+VERSION\r\n"
      response = "KSerial 1.0\r\n"
    },
    {
      request = "AT+STATUS?\r\n"
      response = "STATUS:READY\r\n"
      delay = "200~500"
    },
    {
      request = "PING\r\n"
      response = "PONG\r\n"
    },
    {
      request = "AT+ERRORTEST\r\n"
      response = "ERROR:SIMULATED_FAULT\r\n"
    }
  ]
}
