# KSerial 自动化测试序列示例
#
# 配合 07-bridge-many-to-many.conf（桥接）+ 08-simulator-device.conf（模拟设备）使用：
#   COM2 = 本测试连接的一端，命令经桥接转发到 COM4 的模拟器，应答再回到 COM2。
# 也可以把 port 改成一个真实设备的串口，直接跑固件回归。

test {
  connection {
    port = "COM2"
    baudRate = 115200
    dataBits = 8
    stopBits = "1"
    parity = "none"
    flowControl = "none"
  }

  defaults {
    # 单步未指定 timeout 时用它；单位毫秒。
    timeout = 1000
    # 每步发送前的等待（也用于"只发不等"的步骤留出处理时间）。
    interval = 100
  }

  steps = [
    {
      name = "握手"
      send = "AT\r\n"
      expect = "OK"
    },
    {
      name = "版本查询"
      send = "AT+VERSION\r\n"
      expect = "KSerial 1.0"
    },
    {
      name = "状态查询（应答较慢）"
      send = "AT+STATUS?\r\n"
      expect = "STATUS:READY"
      timeout = 1500
    },
    {
      name = "错误路径"
      send = "AT+ERRORTEST\r\n"
      expect = "ERROR:"
    },
    {
      name = "静默检查"
      # silence：在 timeout 窗口内不应收到任何字节（验证设备不会乱发数据）
      match = "silence"
      timeout = 500
    },
    {
      name = "HEX 指令"
      # encoding = "hex" 时 send 按字节解析，expect 也按去空格大写 HEX 比较
      encoding = "hex"
      send = "41 54 0D 0A"
      expect = "4F 4B"
    }
  ]
}
