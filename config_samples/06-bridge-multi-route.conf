# Level 6: three endpoints with one-to-many and return routes.
# Each endpoint id must be unique, and each physical port can appear only once.

gateway {
  endpoints = [
    {
      id = "sensor"
      name = "Sensor"
      port = "COM1"
      baudRate = 115200
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
      autoOpen = false
    },
    {
      id = "controller"
      name = "Controller"
      port = "COM2"
      baudRate = 115200
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
      autoOpen = false
    },
    {
      id = "logger"
      name = "Data Logger"
      port = "COM3"
      baudRate = 115200
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
      autoOpen = false
    }
  ]

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "Sensor fan-out", "Controller reply"]
  }

  routes = [
    {
      # One source can forward to multiple targets.
      name = "Sensor fan-out"
      sources = ["sensor"]
      targets = ["controller", "logger"]
      enabled = true
    },
    {
      name = "Controller reply"
      sources = ["controller"]
      targets = ["sensor"]
      enabled = true
    },
    {
      # Disabled routes remain in the file and can be enabled later.
      name = "Logger replay"
      sources = ["logger"]
      targets = ["controller"]
      enabled = false
    }
  ]
}
