# Level 2: text protocol with complete serial parameters and log highlighting.
# A delimiter-based request must include the delimiter in the rule itself.

simulator {
  endpoint {
    port = "COM2"
    baudRate = 9600
    dataBits = 8
    stopBits = 1
    parity = "none"
    flowControl = "none"
  }

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "OK", "AT+VERSION"]
  }

  encode = "ASCII"
  delimiter = "\r\n"

  rules = [
    {
      request = "AT\r\n"
      response = "OK\r\n"
    },
    {
      request = "AT+VERSION\r\n"
      response = "KSerial 1.0\r\n"
    },
    {
      request = "AT+STATUS?\r\n"
      response = "STATUS:READY\r\n"
    }
  ]
}
