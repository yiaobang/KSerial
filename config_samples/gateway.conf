# Serial gateway sample.
gateway {
  endpoints = [
    {
      id = "devA"
      name = "Device A"
      port = "COM1"
      baudRate = 9600
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
      autoOpen = false
    },
    {
      id = "devB"
      name = "Device B"
      port = "COM2"
      baudRate = 115200
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
      autoOpen = false
    }
  ]

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "A to B", "B to A"]
  }

  routes = [
    {
      name = "A to B"
      enabled = true
      sources = ["devA"]
      targets = ["devB"]
    },
    {
      name = "B to A"
      enabled = true
      sources = ["devB"]
      targets = ["devA"]
    }
  ]
}
