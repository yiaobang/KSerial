# 网络端点示例：串口 ⇄ TCP 双向透传
#
# 端点地址除了 COMx / /dev/ttyUSBx，还支持：
#   tcp://host:port    作为客户端连接串口服务器（ser2net、ESP-Link、USR-TCP232 等）
#   tcp-listen://port  本机监听，等待对端接入（一对一，后接入的会顶掉前一个）
#   udp://host:port    向固定对端发 UDP（串口转 UDP 模块常见）
#   udp-listen://port  监听 UDP，用首个报文的对端地址作为回发目标
#
# 网络端点没有波特率概念，可以省略 baudRate / parity 等串口参数。

gateway {
  endpoints = [
    {
      id = "serial"
      name = "本地串口"
      port = "COM3"
      baudRate = 115200
      dataBits = 8
      stopBits = "1"
      parity = "none"
      flowControl = "none"
    },
    {
      id = "net"
      name = "TCP 9000"
      # 改成 tcp://192.168.1.20:8080 就是客户端模式，连接远端串口服务器。
      port = "tcp-listen://9000"
    }
  ]

  # 双向都要写：网络端收到的数据也要回到串口，否则只有单向透传。
  routes = [
    { name = "serial-to-net", sources = ["serial"], targets = ["net"] },
    { name = "net-to-serial", sources = ["net"], targets = ["serial"] }
  ]

  logFormat = "auto"
  mergeForwardedLogs = true
}
