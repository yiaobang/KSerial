# Level 3: fixed-length HEX frames.
# Every request below contains exactly four bytes because packSize is 4.

simulator {
  endpoint {
    port = "COM3"
    baudRate = 115200
    dataBits = 8
    stopBits = 1
    parity = "even"
    flowControl = "none"
    autoOpen = false
  }

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["01 03", "01 06", "ERROR"]
  }

  encode = "HEX"
  packSize = 4

  rules = [
    {
      request = "01 03 00 00"
      response = "01 03 02 00 2A"
    },
    {
      request = "01 06 00 01"
      response = "01 06 00 01"
    }
  ]
}
