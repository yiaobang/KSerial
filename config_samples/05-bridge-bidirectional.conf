# Level 5: a bidirectional bridge with complete endpoint parameters.

gateway {
  endpoints = [
    {
      id = "deviceA"
      name = "Device A"
      port = "COM1"
      baudRate = 9600
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
    },
    {
      id = "deviceB"
      name = "Device B"
      port = "COM2"
      baudRate = 115200
      dataBits = 8
      stopBits = 1
      parity = "none"
      flowControl = "none"
    }
  ]

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "Device A", "Device B"]
  }

  routes = [
    {
      name = "A to B"
      sources = ["deviceA"]
      targets = ["deviceB"]
      enabled = true
    },
    {
      name = "B to A"
      sources = ["deviceB"]
      targets = ["deviceA"]
      enabled = true
    }
  ]
}
