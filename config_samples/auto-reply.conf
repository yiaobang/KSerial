# Auto reply simulator sample.
# Text mode can use delimiter. HEX mode can use packSize or delimiter.
simulator {
  endpoint {
    port = "COM2"
    baudRate = 9600
    dataBits = 8
    stopBits = 1
    parity = "none"
    flowControl = "none"
    autoOpen = false
  }

  highlight {
    enabled = true
    ignoreCase = true
    keywords = ["ERROR", "WARN", "OK", "AT+VERSION"]
  }

  encode = "ASCII"
  delimiter = "\r\n"

  rules = [
    {
      request = "AT\r\n"
      response = "OK\r\n"
    },
    {
      request = "AT+VERSION\r\n"
      response = "KSerial 1.0\r\n"
    }
  ]
}
